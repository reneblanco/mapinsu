<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte enviado | MAPINSU</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex items-center justify-center px-5">
    <main class="w-full max-w-md text-center">
        <div class="mx-auto w-14 h-14 rounded-2xl bg-emerald-100 text-[#28AD56] flex items-center justify-center mb-5">
            <i data-lucide="check" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-950 tracking-tight">Reporte enviado</h1>
        <p class="mt-3 text-sm sm:text-base text-slate-600 leading-relaxed">
            Gracias por ayudar a mejorar MAPINSU. Revisaremos el reporte lo antes posible.
        </p>
        <a href="/" class="inline-flex items-center justify-center gap-2 mt-7 bg-[#18529D] hover:bg-[#113d75] text-white font-bold px-5 py-3 rounded-xl transition-colors shadow-sm">
            <i data-lucide="map" class="w-4 h-4"></i>
            Volver al mapa
        </a>
    </main>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
